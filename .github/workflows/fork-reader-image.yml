name: Fork Reader - Publish Image

on:
  push:
    branches: [android-reader]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-reader-image
  cancel-in-progress: false

jobs:
  reader-tests:
    if: github.repository == 'graypawn/grimmory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend run typecheck
      - run: pnpm -C frontend test --include=src/app/features/readers/ebook-reader/core/event.service.spec.ts

  publish:
    needs: reader-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=graypawn-android-reader-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fork-reader
          cache-to: type=gha,scope=fork-reader,mode=max
      - name: Deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Reader image'
            echo "Tag: \`$IMAGE:$VERSION\`"
            echo "Pinned image: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
